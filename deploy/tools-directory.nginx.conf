server {
 listen 8082;
 server_name _;
 server_tokens off;
 client_max_body_size 6m;
 access_log /www/wwwlogs/tools-directory.access.log;
 error_log /www/wwwlogs/tools-directory.error.log;
 # Recommendation action URLs must preserve HEAD and must never be proxy-cached.
 location ^~ /r/ {
  proxy_cache off;
  proxy_cache_convert_head off;
  proxy_pass http://127.0.0.1:3020;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
 }
 # Entry and advertising actions use the same no-cache, original-method contract.
 location ^~ /go/ {
  proxy_cache off;
  proxy_cache_convert_head off;
  proxy_pass http://127.0.0.1:3020;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
 }
 location / {
  proxy_pass http://127.0.0.1:3020;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
 }
}
